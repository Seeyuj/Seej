name: Rust CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "seej/server/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "seej/server/**"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: seej/server

jobs:
  sy-core-purity:
    name: sy_core purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run purity gate self-test
        run: python3 scripts/check_sy_core_purity.py --self-test

      - name: Check sy_core purity
        run: python3 scripts/check_sy_core_purity.py

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            seej/server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('seej/server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check compilation
        run: cargo check --workspace --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            seej/server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('seej/server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            seej/server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('seej/server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace --all-targets

  ignored-tests:
    name: Ignored long-running tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            seej/server/target
          key: ${{ runner.os }}-cargo-ignored-${{ hashFiles('seej/server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ignored-
            ${{ runner.os }}-cargo-

      - name: Run ignored tests
        run: cargo test --workspace --all-targets -- --ignored

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            seej/server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('seej/server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --workspace --release

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            seej/server/target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('seej/server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: cargo llvm-cov -p sy_core -p sy_infra --all-targets --fail-under-lines 70

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Audit dependencies
        uses: actions-rust-lang/audit@v1
        with:
          workingDirectory: seej/server

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check dependency policy
        run: cargo deny check advisories licenses sources
        working-directory: seej/server

      - name: Check architectural dependency rules
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--format-version", "1", "--no-deps"
          ], text=True))
          packages = {pkg["name"]: pkg for pkg in metadata["packages"]}

          def deps(name):
              return {
                  dep["name"]
                  for dep in packages[name]["dependencies"]
                  if dep.get("kind") is None
              }

          errors = []
          if deps("sy_types") != set():
              errors.append(f"sy_types must have zero dependencies; got {sorted(deps('sy_types'))}")
          if deps("sy_api") != {"sy_types"}:
              errors.append(f"sy_api deps must be strictly sy_types; got {sorted(deps('sy_api'))}")
          if deps("sy_core") != {"sy_types", "sy_api"}:
              errors.append(f"sy_core deps must be strictly sy_types, sy_api; got {sorted(deps('sy_core'))}")
          for path in [
              "crates/sy_core/src/ports/event_log.rs",
              "crates/sy_core/src/ports/store.rs",
          ]:
              if pathlib.Path(path).exists():
                  errors.append(f"sy_core must not own persistence port file: {path}")
          for name in packages:
              if name.startswith("mod_") and "sy_core" in deps(name):
                  errors.append(f"{name} must not depend on sy_core")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY
