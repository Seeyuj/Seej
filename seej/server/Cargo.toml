[workspace]
resolver = "2"

# Clean-slate D-015 workspace skeleton.
# Add binaries (`server_d`, `sy_cli`) and external dependencies only when their
# implementing phase in `doc/ROADMAP.md` requires them.
members = [
    "crates/sy_types",
    "crates/sy_api",
    "crates/sy_core",
    "crates/sy_infra",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Seej Team"]
license = "MIT"

[workspace.dependencies]
sy_types = { path = "crates/sy_types" }
sy_api = { path = "crates/sy_api" }
sy_core = { path = "crates/sy_core" }
sy_infra = { path = "crates/sy_infra" }
