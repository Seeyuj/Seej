[package]
name = "seej_lab_workloads"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[[bin]]
name = "workloads"
path = "src/main.rs"

[dependencies]
blake3 = "1"
crc32fast = "1.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.10"

[workspace]
